; Klar-lampan firmware — LilyGO T-Dongle S3 (ESP32-S3, ST7735 160x80, APA102 LED)
; Separate project from Argus's firmware/ so the Argus build is untouched.
[env:t_dongle_s3]
; Same pioarduino platform Argus uses — Arduino Core 3.x, required by
; "GFX Library for Arduino" (needs esp32-hal-periman.h, absent on Core 2.x).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; The base T-Dongle-S3 is a 4MB-flash / no-PSRAM part. The framebuffer is only
; 160*80*2 = 25 KB and fits in internal SRAM, so PSRAM is not required. Owners of
; the "Plus" (16MB) variant can raise flash_size.
board_upload.flash_size = 4MB
board_build.partitions = default.csv

upload_speed = 921600
monitor_speed = 115200

build_flags =
    ; Route Serial to the native USB-Serial-JTAG (HWCDC), like Argus, so the
    ; device is a plain CDC COM port with no driver.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0
    bblanchon/ArduinoJson@^7.0.0
