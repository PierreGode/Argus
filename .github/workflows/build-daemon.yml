name: Build Daemon EXE

on:
  push:
    paths:
      - "daemon/**"
      - "assets/argus.ico"
      - "tools/make_ico.py"
      - ".github/workflows/build-daemon.yml"
  pull_request:
    paths:
      - "daemon/**"
      - "assets/argus.ico"
      - "tools/make_ico.py"
      - ".github/workflows/build-daemon.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: daemon/requirements.txt

      - name: Install dependencies
        run: pip install -r daemon/requirements.txt

      - name: Build EXE with PyInstaller
        shell: bash
        run: pyinstaller daemon/argus-daemon.spec --noconfirm

      - name: Build MSI (WiX)
        shell: pwsh
        run: |
          $base = [regex]::Match((Get-Content daemon/version.py -Raw), '"([^"]+)"').Groups[1].Value
          $mm = ($base -split '\.')[0..1] -join '.'
          $msiVersion = "$mm.$env:GITHUB_RUN_NUMBER"
          ./daemon/packaging/windows/build-msi.ps1 -SkipExe -Version $msiVersion

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: argus-daemon-windows
          path: |
            dist/argus-daemon.exe
            dist/Argus-Setup.msi

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: daemon/requirements.txt

      - name: Install dependencies
        run: pip install -r daemon/requirements.txt

      - name: Build binary with PyInstaller
        run: pyinstaller daemon/argus-daemon.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: argus-daemon-macos
          path: dist/argus-daemon

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: daemon/requirements.txt

      - name: Install dependencies
        run: pip install -r daemon/requirements.txt

      - name: Build binary with PyInstaller
        run: pyinstaller daemon/argus-daemon.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: argus-daemon-linux
          path: dist/argus-daemon
