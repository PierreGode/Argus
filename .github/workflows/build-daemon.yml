name: Build Daemon EXE

on:
  push:
    paths:
      - "daemon/**"
      - "assets/argus.ico"
      - "tools/make_ico.py"
      - ".github/workflows/build-daemon.yml"
  pull_request:
    paths:
      - "daemon/**"
      - "assets/argus.ico"
      - "tools/make_ico.py"
      - ".github/workflows/build-daemon.yml"
  workflow_dispatch:
    inputs:
      msi_version:
        description: "Override the MSI ProductVersion (e.g. 1.0.6). Leave blank to use the default 1.0.<run number>."
        required: false
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: daemon/requirements.txt

      - name: Install dependencies
        run: pip install -r daemon/requirements.txt

      - name: Build EXE with PyInstaller
        shell: bash
        run: pyinstaller daemon/argus-daemon.spec --noconfirm

      - name: Build MSI (WiX)
        shell: pwsh
        run: |
          if ("${{ inputs.msi_version }}") {
            ./daemon/packaging/windows/build-msi.ps1 -SkipExe -Version "${{ inputs.msi_version }}"
          } else {
            ./daemon/packaging/windows/build-msi.ps1 -SkipExe -BuildNumber $env:GITHUB_RUN_NUMBER
          }

      - name: Upload artifact
        # Windows is built as onedir (see argus-daemon.spec) — the exe needs
        # its sibling dist/argus-daemon/_internal/ to run, so the whole
        # folder ships, not just the .exe.
        uses: actions/upload-artifact@v4
        with:
          name: argus-daemon-windows
          path: |
            dist/argus-daemon/
            dist/Argus-Setup.msi

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: daemon/requirements.txt

      - name: Install dependencies
        run: pip install -r daemon/requirements.txt

      - name: Build binary with PyInstaller
        run: pyinstaller daemon/argus-daemon.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: argus-daemon-macos
          path: dist/argus-daemon

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: daemon/requirements.txt

      - name: Install dependencies
        run: pip install -r daemon/requirements.txt

      - name: Build binary with PyInstaller
        run: pyinstaller daemon/argus-daemon.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: argus-daemon-linux
          path: dist/argus-daemon
